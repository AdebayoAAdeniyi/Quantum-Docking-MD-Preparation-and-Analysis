# =============================================================================
#  cluster.conf - one place to describe where and how jobs run
#  Copy to config/cluster.local.conf (git-ignored) and edit for your machine.
#  Every "run" script reads this file, so the same workflow works on a laptop,
#  a PBS cluster (e.g. CHPC Lengau) or a SLURM cluster (e.g. Compute Canada).
# =============================================================================
SCHEDULER=${SCHEDULER:-local}          # local | pbs | slurm
ACCOUNT=${ACCOUNT:-}                 # PBS -P project  or  SLURM --account
QUEUE=${QUEUE:-}                   # PBS -q queue    or  SLURM --partition
NODES=${NODES:-1}
CORES=${CORES:-8}                  # cores (MPI ranks or threads) per job
MEM=${MEM:-16G}
WALLTIME=${WALLTIME:-24:00:00}
GPUS=${GPUS:-0}
EMAIL=${EMAIL:-}                   # leave empty for no mail

# Lines placed in every job script before the program runs. Use them to load
# modules or source environments, for example:
#   GAUSSIAN_SETUP="module load gaussian/g16"
GAUSSIAN_SETUP=${GAUSSIAN_SETUP:-""}
ORCA_SETUP=${ORCA_SETUP:-""}            # ORCA must be called with its full path for parallel runs
ORCA_EXE=${ORCA_EXE:-"orca"}
GAMESS_SETUP=${GAMESS_SETUP:-""}
GAMESS_EXE=${GAMESS_EXE:-"rungms"}          # GAMESS-US run script
FIREFLY_SETUP=${FIREFLY_SETUP:-""}
FIREFLY_EXE=${FIREFLY_EXE:-"firefly"}
NWCHEM_SETUP=${NWCHEM_SETUP:-""}
CP2K_SETUP=${CP2K_SETUP:-""}
XTB_SETUP=${XTB_SETUP:-""}
AMBER_SETUP=${AMBER_SETUP:-""}           # e.g. "source \$AMBERHOME/amber.sh"
GROMACS_SETUP=${GROMACS_SETUP:-""}         # e.g. "module load gromacs/2023"
GMX=${GMX:-"gmx"}                # gmx, gmx_mpi or "mpirun -np 4 gmx_mpi"
LAMMPS_SETUP=${LAMMPS_SETUP:-""}
LMP=${LMP:-"lmp"}
VINA_SETUP=${VINA_SETUP:-""}
